name: Release
# A pushed tag v<version> makes the release: pinshot.exe (Windows package) and PinShot-mac.zip (macOS package, signed
# and notarized) built from the tag and put on its GitHub release, which is made here when it is not there yet (made
# by hand first, with notes of its own, it is kept and only given the files).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the app's version
        run: |
          ver=$(sed -n 's/^let app_version : String = "\(.*\)"$/\1/p' src/main.pion)
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not app_version $ver (src/main.pion)"
            exit 1
          fi

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Put the files on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          (cd assets && sha256sum pinshot.exe PinShot-mac.zip)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/pinshot.exe assets/PinShot-mac.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
              assets/pinshot.exe assets/PinShot-mac.zip
          fi

  # The download site and the updates: latest.json signed with the release key, pinshot.exe and the Mac build put in
  # the R2 bucket, the site deployed (packaging/publish.ps1, which takes the Mac build from the release made above).
  # The key and Cloudflare's token are the `release` environment's alone: a v* tag's run, once its reviewer has
  # approved it.
  publish:
    needs: release
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PinShot-windows
          path: out/Release
      - name: Sign, put in R2, deploy the site
        shell: pwsh
        env:
          SIGN_KEY: ${{ secrets.PINSHOT_SIGN_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:SIGN_KEY -or -not $env:CLOUDFLARE_API_TOKEN) { throw "the release environment has no PINSHOT_SIGN_KEY or CLOUDFLARE_API_TOKEN" }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $env:PINSHOT_SIGN_KEY = Join-Path $env:RUNNER_TEMP "release-key.pem"
          [IO.File]::WriteAllText($env:PINSHOT_SIGN_KEY, $env:SIGN_KEY)
          try {
            ./packaging/publish.ps1 -Version $version
          } finally {
            Remove-Item -Force $env:PINSHOT_SIGN_KEY
          }
      - name: The site says the new version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://pin-shot.pages.dev/dl/latest.json?t=$RANDOM" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            [ "$got" = "$want" ] && { echo "latest.json: $got"; exit 0; }
            sleep 10
          done
          echo "::error::pin-shot.pages.dev/dl/latest.json says '$got', not $want"
          exit 1
