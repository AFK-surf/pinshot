name: macOS package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
# (contents: write, to attach the build to a tag's release: the token is read-only otherwise, and v1.0.8's upload was
# refused with 403)
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: bash scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PinShot-mac-${{ runner.arch }}
          path: out/build/PinShot-mac.zip
      # (a tag's build goes on its release too, once the release is there: gh release create comes first)
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "$GITHUB_REF_NAME" out/build/PinShot-mac.zip --clobber
