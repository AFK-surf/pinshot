name: macOS package
# PinShot.app for Apple silicon: built (scripts/build-mac.sh), signed with AFK AI's Developer ID and notarized
# (scripts/sign-mac.sh), kept as the run's artifact. The release workflow calls it for a tag.
on:
  workflow_dispatch:
  workflow_call:
  # (a change to what the macOS build is made of, built before it is merged; signed and notarized only for a tag or
  # a run by hand)
  pull_request:
    paths:
      - 'src/**'
      - 'native/**'
      - 'assets/**'
      - 'packaging/macos/**'
      - 'pion.toml'
      - 'scripts/build-mac.sh'
      - '.github/workflows/macos.yml'
  # (and once merged: a pull request reads only its own caches and master's, so master keeps the toolchain and the
  # pionc cache warm for the next pull request and tag)
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'native/**'
      - 'assets/**'
      - 'packaging/macos/**'
      - 'pion.toml'
      - 'scripts/build-mac.sh'
      - '.github/workflows/macos.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    # (PR and master CI stay under a 3-minute hard cap; release/dispatch runs also wait on Apple's remote notarytool)
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 15 || 3 }}
    steps:
      - name: Record job start
        run: |
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          # (pionc's content-addressed cache; the runner context is not available to a job's env)
          echo "PION_CACHE_DIR=${{ runner.temp }}/pion-cas" >> "$GITHUB_ENV"

      - name: Checkout PinShot
        uses: actions/checkout@v4
        with:
          path: pinshot
          persist-credentials: false

      - name: Checkout invar
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/invar
          ref: 8d5834e468585656d5094d9d40f3443c18c49063
          path: invar
          persist-credentials: false

      - name: Checkout pion-packages
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/pion-packages
          ref: 8014f92596624ab01af599b03851c7d3ad1f9701
          path: pion-packages
          persist-credentials: false

      - name: Checkout pion
        uses: actions/checkout@v4
        with:
          repository: AFK-surf/pion
          ref: 868866e53b8530c9e198fc743a76619b6a1ab362
          path: pion
          persist-credentials: false

      - name: Cache pion toolchain
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: |
            pion/out/pionc2
            pion/out/qbe
            pion/out/libpionrt.a
          key: pion-macos-arm64-868866e53b8530c9e198fc743a76619b6a1ab362

      # (pionc's content-addressed cache: what an unchanged package compiled to is taken from it, not compiled again)
      - name: Cache pionc objects
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: pion-cas-macos-arm64-868866e53b8530c9e198fc743a76619b6a1ab362-${{ hashFiles('pinshot/pion.toml', 'pinshot/src/**', 'pinshot/native/**', 'pinshot/assets/**') }}
          restore-keys: |
            pion-cas-macos-arm64-868866e53b8530c9e198fc743a76619b6a1ab362-

      - name: Bootstrap pionc2
        if: steps.pion-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          OUT_DIR="$PWD/pion/out"
          COMPILER_DIR="$PWD/pion/compiler"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$OUT_DIR"
          export PION_QBE="$OUT_DIR/qbe"
          export PION_RT_LIB="$OUT_DIR/libpionrt.a"
          PION_RT_CLI_LIB="$OUT_DIR/libpionrt_cli.a"
          sh pion/scripts/build-qbe.sh "$PION_QBE"
          cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c pion/runtime/pion_rt.c -o "$OUT_DIR/pion_rt.o"
          ar rcs "$PION_RT_LIB" "$OUT_DIR/pion_rt.o"
          cc -std=c11 -O2 -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c pion/runtime/pion_cli.c -o "$OUT_DIR/pion_cli.o"
          ar rcs "$PION_RT_CLI_LIB" "$OUT_DIR/pion_rt.o" "$OUT_DIR/pion_cli.o"
          gzip -dc pion/bootstrap/pionc-seed.ssa.gz > "$TMP_DIR/pionc-seed.ssa"
          "$PION_QBE" -t arm64_apple -o "$TMP_DIR/pionc0.s" "$TMP_DIR/pionc-seed.ssa"
          cc "$TMP_DIR/pionc0.s" "$PION_RT_CLI_LIB" -lm -lpthread -o "$OUT_DIR/pionc0"
          mkdir -p "$TMP_DIR/cas_s1" "$TMP_DIR/cas_s2"
          PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s1" "$OUT_DIR/pionc0" build -o "$OUT_DIR/pionc1" "$COMPILER_DIR/src/core" "$COMPILER_DIR/src/cli/main.pion"
          PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s2" "$OUT_DIR/pionc1" build -o "$OUT_DIR/pionc2" "$COMPILER_DIR/src/core" "$COMPILER_DIR/src/cli/main.pion"

      - name: Build PinShot.app
        timeout-minutes: 3
        env:
          PIONC: ${{ github.workspace }}/pion/out/pionc2
          PION_QBE: ${{ github.workspace }}/pion/out/qbe
          PION_RT_LIB: ${{ github.workspace }}/pion/out/libpionrt.a
        run: bash pinshot/scripts/build-mac.sh

      # (AFK AI's Developer ID, the keychain AFK-surf/monoid signs still.fail with: a fork's run, without the secrets,
      # fails here rather than put out an ad hoc build)
      - name: Sign and notarize PinShot.app
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
        run: bash pinshot/scripts/sign-mac.sh pinshot/out/build/PinShot.app

      - uses: actions/upload-artifact@v4
        with:
          name: PinShot-mac-${{ runner.arch }}
          path: |
            pinshot/out/build/PinShot-mac.dmg
            pinshot/out/build/PinShot-mac.zip
          if-no-files-found: error

      - name: Check 60s duration target
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - JOB_START_EPOCH ))
          echo "Job macos-package duration: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 60 ]; then
            echo "::warning title=CI duration > 60s::macos-package took ${ELAPSED}s (target <= 60s, hard timeout 180s)"
          fi
